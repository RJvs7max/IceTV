name: Build FireLauncher APK


on:
  push:
    branches: [ main, master ]
  workflow_dispatch:


jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Generate PS5 + Apple TV Full Control Project Files
        run: |
          mkdir -p app/src/main/java/com/me/launcher
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values


          cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "FireLauncher"
          include(":app")
          EOF


          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.5.0" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF


          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2g
          android.useAndroidX=true
          kotlin.code.style=official
          EOF


          cat << 'EOF' > app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }


          android {
              namespace = "com.me.launcher"
              compileSdk = 34


              defaultConfig {
                  applicationId = "com.me.launcher"
                  minSdk = 22
                  targetSdk = 34
                  versionCode = 7
                  versionName = "4.0-PS-tvOS"
              }


              buildTypes {
                  release {
                      isMinifyEnabled = true
                      isShrinkResources = true
                      proguardFiles(
                          getDefaultProguardFile("proguard-android-optimize.txt"),
                          "proguard-rules.pro"
                      )
                  }
              }


              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }


              kotlinOptions {
                  jvmTarget = "17"
              }
          }


          dependencies {
              implementation("androidx.recyclerview:recyclerview:1.3.2")
          }
          EOF


          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:tools="http://schemas.android.com/tools">


              <uses-feature
                  android:name="android.software.leanback"
                  android:required="false" />
              <uses-feature
                  android:name="android.hardware.touchscreen"
                  android:required="false" />


              <uses-permission
                  android:name="android.permission.QUERY_ALL_PACKAGES"
                  tools:ignore="QueryAllPackagesPermission" />
              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.ACCESS_WIFI_STATE" />
              <uses-permission
                  android:name="android.permission.READ_EXTERNAL_STORAGE"
                  android:maxSdkVersion="32" />
              <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />


              <application
                  android:allowBackup="true"
                  android:hardwareAccelerated="true"
                  android:label="IceTV"
                  android:theme="@style/AppTheme">


                  <activity
                      android:name=".MainActivity"
                      android:clearTaskOnLaunch="true"
                      android:exported="true"
                      android:launchMode="singleTask"
                      android:screenOrientation="landscape"
                      android:stateNotNeeded="true">


                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.HOME" />
                          <category android:name="android.intent.category.DEFAULT" />
                      </intent-filter>


                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LEANBACK_LAUNCHER" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>


                  <receiver
                      android:name=".BootReceiver"
                      android:enabled="true"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.BOOT_COMPLETED" />
                          <action android:name="android.intent.action.QUICKBOOT_POWERON" />
                      </intent-filter>
                  </receiver>
              </application>
          </manifest>
          EOF


          cat << 'EOF' > app/src/main/res/values/colors.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="ps_bg_top">#071329</color>
              <color name="ps_bg_mid">#0B2247</color>
              <color name="ps_bg_bottom">#040914</color>
              <color name="text_primary">#F5F8FF</color>
              <color name="text_secondary">#9FB4D6</color>
              <color name="glass_card">#44142747</color>
              <color name="glass_card_focused">#77244780</color>
              <color name="focus_ring">#FFFFFF</color>
              <color name="pill_bg">#33FFFFFF</color>
              <color name="panel_bg">#EE0A1529</color>
          </resources>
          EOF


          cat << 'EOF' > app/src/main/res/values/styles.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="@android:style/Theme.DeviceDefault.NoActionBar">
                  <item name="android:windowBackground">@drawable/ps_wallpaper_base</item>
              </style>
          </resources>
          EOF


          cat << 'EOF' > app/src/main/res/drawable/ps_wallpaper_base.xml
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android"
              android:shape="rectangle">
              <gradient
                  android:angle="315"
                  android:centerColor="@color/ps_bg_mid"
                  android:endColor="@color/ps_bg_bottom"
                  android:startColor="@color/ps_bg_top"
                  android:type="linear" />
          </shape>
          EOF


          cat << 'EOF' > app/src/main/res/drawable/hero_banner_bg.xml
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android"
              android:shape="rectangle">
              <gradient
                  android:angle="0"
                  android:endColor="#550E1E3B"
                  android:startColor="#77193563"
                  android:type="linear" />
              <stroke
                  android:width="1dp"
                  android:color="#44FFFFFF" />
              <corners android:radius="22dp" />
          </shape>
          EOF


          cat << 'EOF' > app/src/main/res/drawable/control_panel_bg.xml
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android"
              android:shape="rectangle">
              <solid android:color="@color/panel_bg" />
              <stroke
                  android:width="1.5dp"
                  android:color="#4DFFFFFF" />
              <corners android:radius="24dp" />
          </shape>
          EOF


          cat << 'EOF' > app/src/main/res/drawable/card_bg.xml
          <?xml version="1.0" encoding="utf-8"?>
          <selector xmlns:android="http://schemas.android.com/apk/res/android">
              <item android:state_focused="true">
                  <shape android:shape="rectangle">
                      <solid android:color="@color/glass_card_focused" />
                      <stroke
                          android:width="3dp"
                          android:color="@color/focus_ring" />
                      <corners android:radius="18dp" />
                  </shape>
              </item>
              <item>
                  <shape android:shape="rectangle">
                      <solid android:color="@color/glass_card" />
                      <stroke
                          android:width="1dp"
                          android:color="#33FFFFFF" />
                      <corners android:radius="18dp" />
                  </shape>
              </item>
          </selector>
          EOF


          cat << 'EOF' > app/src/main/res/drawable/pill_button_bg.xml
          <?xml version="1.0" encoding="utf-8"?>
          <selector xmlns:android="http://schemas.android.com/apk/res/android">
              <item android:state_focused="true">
                  <shape android:shape="rectangle">
                      <solid android:color="#FFFFFF" />
                      <corners android:radius="50dp" />
                  </shape>
              </item>
              <item>
                  <shape android:shape="rectangle">
                      <solid android:color="@color/pill_bg" />
                      <corners android:radius="50dp" />
                  </shape>
              </item>
          </selector>
          EOF


          cat << 'EOF' > app/src/main/res/drawable/panel_item_bg.xml
          <?xml version="1.0" encoding="utf-8"?>
          <selector xmlns:android="http://schemas.android.com/apk/res/android">
              <item android:state_focused="true">
                  <shape android:shape="rectangle">
                      <solid android:color="#FFFFFF" />
                      <corners android:radius="14dp" />
                  </shape>
              </item>
              <item>
                  <shape android:shape="rectangle">
                      <solid android:color="#1FFFFFFF" />
                      <corners android:radius="14dp" />
                  </shape>
              </item>
          </selector>
          EOF


          cat << 'EOF' > app/src/main/res/layout/activity_main.xml
          <?xml version="1.0" encoding="utf-8"?>
          <FrameLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:background="@drawable/ps_wallpaper_base"
              android:clipChildren="false"
              android:clipToPadding="false">


              <!-- Custom Gallery Wallpaper Layer (Downsampled for Low RAM) -->
              <ImageView
                  android:id="@+id/bg_wallpaper"
                  android:layout_width="match_parent"
                  android:layout_height="match_parent"
                  android:contentDescription="@null"
                  android:scaleType="centerCrop"
                  android:visibility="gone" />


              <!-- Subtle Dark Scrim for Icon Legibility over Custom Photos -->
              <View
                  android:id="@+id/bg_scrim"
                  android:layout_width="match_parent"
                  android:layout_height="match_parent"
                  android:background="#55040914"
                  android:visibility="gone" />


              <!-- Low-End Friendly PS4 / PS5 Ambient Live Wave Wallpaper -->
              <com.me.launcher.PsWaveView
                  android:id="@+id/ps_waves"
                  android:layout_width="match_parent"
                  android:layout_height="match_parent" />


              <!-- Main Foreground tvOS Layout -->
              <LinearLayout
                  android:layout_width="match_parent"
                  android:layout_height="match_parent"
                  android:clipChildren="false"
                  android:clipToPadding="false"
                  android:orientation="vertical"
                  android:paddingStart="44dp"
                  android:paddingTop="24dp"
                  android:paddingEnd="44dp"
                  android:paddingBottom="20dp">


                  <!-- Top Status & Quick-Control Bar -->
                  <LinearLayout
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:clipChildren="false"
                      android:clipToPadding="false"
                      android:gravity="center_vertical"
                      android:orientation="horizontal">


                      <TextView
                          android:layout_width="wrap_content"
                          android:layout_height="wrap_content"
                          android:letterSpacing="0.06"
                          android:text="IceTV"
                          android:textColor="@color/text_primary"
                          android:textSize="22sp"
                          android:textStyle="bold" />


                      <TextView
                          android:id="@+id/network_status"
                          android:layout_width="0dp"
                          android:layout_height="wrap_content"
                          android:layout_marginStart="16dp"
                          android:layout_weight="1"
                          android:ellipsize="end"
                          android:singleLine="true"
                          android:text="Connected"
                          android:textColor="@color/text_secondary"
                          android:textSize="13sp" />


                      <TextView
                          android:id="@+id/btn_reset_hidden"
                          android:layout_width="wrap_content"
                          android:layout_height="34dp"
                          android:layout_marginEnd="10dp"
                          android:background="@drawable/pill_button_bg"
                          android:focusable="true"
                          android:focusableInTouchMode="true"
                          android:gravity="center"
                          android:paddingStart="14dp"
                          android:paddingEnd="14dp"
                          android:text="Unhide Apps"
                          android:textColor="@color/text_primary"
                          android:textSize="12sp"
                          android:textStyle="bold"
                          android:visibility="gone" />


                      <TextView
                          android:id="@+id/btn_wallpaper"
                          android:layout_width="wrap_content"
                          android:layout_height="34dp"
                          android:layout_marginEnd="10dp"
                          android:background="@drawable/pill_button_bg"
                          android:focusable="true"
                          android:focusableInTouchMode="true"
                          android:gravity="center"
                          android:paddingStart="16dp"
                          android:paddingEnd="16dp"
                          android:text="Wallpaper"
                          android:textColor="@color/text_primary"
                          android:textSize="13sp"
                          android:textStyle="bold" />


                      <TextView
                          android:id="@+id/btn_settings"
                          android:layout_width="wrap_content"
                          android:layout_height="34dp"
                          android:layout_marginEnd="16dp"
                          android:background="@drawable/pill_button_bg"
                          android:focusable="true"
                          android:focusableInTouchMode="true"
                          android:gravity="center"
                          android:paddingStart="16dp"
                          android:paddingEnd="16dp"
                          android:text="Control Center"
                          android:textColor="@color/text_primary"
                          android:textSize="13sp"
                          android:textStyle="bold" />


                      <TextClock
                          android:id="@+id/clock"
                          android:layout_width="wrap_content"
                          android:layout_height="wrap_content"
                          android:format12Hour="h:mm a"
                          android:format24Hour="HH:mm"
                          android:textColor="@color/text_primary"
                          android:textSize="18sp"
                          android:textStyle="bold" />
                  </LinearLayout>


                  <!-- Apple TV Top-Shelf Dynamic Hero Banner -->
                  <LinearLayout
                      android:id="@+id/hero_shelf"
                      android:layout_width="match_parent"
                      android:layout_height="146dp"
                      android:layout_marginTop="14dp"
                      android:layout_marginBottom="16dp"
                      android:background="@drawable/hero_banner_bg"
                      android:gravity="center_vertical"
                      android:orientation="horizontal"
                      android:paddingStart="28dp"
                      android:paddingEnd="28dp">


                      <ImageView
                          android:id="@+id/hero_icon"
                          android:layout_width="88dp"
                          android:layout_height="88dp"
                          android:contentDescription="@null"
                          android:scaleType="fitCenter" />


                      <LinearLayout
                          android:layout_width="0dp"
                          android:layout_height="wrap_content"
                          android:layout_marginStart="24dp"
                          android:layout_weight="1"
                          android:orientation="vertical">


                          <TextView
                              android:id="@+id/hero_kicker"
                              android:layout_width="wrap_content"
                              android:layout_height="wrap_content"
                              android:letterSpacing="0.08"
                              android:text="FEATURED"
                              android:textColor="@color/text_secondary"
                              android:textSize="11sp"
                              android:textStyle="bold" />


                          <TextView
                              android:id="@+id/hero_title"
                              android:layout_width="wrap_content"
                              android:layout_height="wrap_content"
                              android:layout_marginTop="2dp"
                              android:ellipsize="end"
                              android:singleLine="true"
                              android:text="Welcome to IceTV"
                              android:textColor="@color/text_primary"
                              android:textSize="28sp"
                              android:textStyle="bold" />


                          <TextView
                              android:id="@+id/hero_subtitle"
                              android:layout_width="wrap_content"
                              android:layout_height="wrap_content"
                              android:layout_marginTop="4dp"
                              android:text="Select to open • Hold Select to hide"
                              android:textColor="@color/text_secondary"
                              android:textSize="13sp" />
                      </LinearLayout>
                  </LinearLayout>


                  <!-- tvOS 5-Column Rounded App Dock Grid -->
                  <androidx.recyclerview.widget.RecyclerView
                      android:id="@+id/grid"
                      android:layout_width="match_parent"
                      android:layout_height="0dp"
                      android:layout_weight="1"
                      android:clipChildren="false"
                      android:clipToPadding="false"
                      android:padding="12dp" />
              </LinearLayout>


              <!-- Built-In tvOS Control Center & Wallpaper Overlay (Never Leaves IceTV) -->
              <FrameLayout
                  android:id="@+id/control_overlay"
                  android:layout_width="match_parent"
                  android:layout_height="match_parent"
                  android:background="#9902060D"
                  android:clickable="true"
                  android:focusable="true"
                  android:visibility="gone">


                  <LinearLayout
                      android:layout_width="460dp"
                      android:layout_height="wrap_content"
                      android:layout_gravity="end|center_vertical"
                      android:layout_marginEnd="44dp"
                      android:background="@drawable/control_panel_bg"
                      android:orientation="vertical"
                      android:padding="26dp">


                      <TextView
                          android:id="@+id/panel_title"
                          android:layout_width="wrap_content"
                          android:layout_height="wrap_content"
                          android:text="IceTV Control Center"
                          android:textColor="@color/text_primary"
                          android:textSize="22sp"
                          android:textStyle="bold" />


                      <TextView
                          android:id="@+id/panel_subtitle"
                          android:layout_width="wrap_content"
                          android:layout_height="wrap_content"
                          android:layout_marginTop="2dp"
                          android:layout_marginBottom="16dp"
                          android:text="Press Back to return to Home"
                          android:textColor="@color/text_secondary"
                          android:textSize="13sp" />


                      <!-- Settings & Network Group -->
                      <LinearLayout
                          android:id="@+id/group_settings"
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:orientation="vertical">


                          <TextView
                              android:id="@+id/opt_wifi"
                              android:layout_width="match_parent"
                              android:layout_height="46dp"
                              android:layout_marginBottom="10dp"
                              android:background="@drawable/panel_item_bg"
                              android:focusable="true"
                              android:gravity="center_vertical"
                              android:paddingStart="18dp"
                              android:paddingEnd="18dp"
                              android:text="Wi-Fi &amp; Network Settings"
                              android:textColor="@color/text_primary"
                              android:textSize="15sp"
                              android:textStyle="bold" />


                          <TextView
                              android:id="@+id/opt_bluetooth"
                              android:layout_width="match_parent"
                              android:layout_height="46dp"
                              android:layout_marginBottom="10dp"
                              android:background="@drawable/panel_item_bg"
                              android:focusable="true"
                              android:gravity="center_vertical"
                              android:paddingStart="18dp"
                              android:paddingEnd="18dp"
                              android:text="Bluetooth &amp; Remotes"
                              android:textColor="@color/text_primary"
                              android:textSize="15sp"
                              android:textStyle="bold" />


                          <TextView
                              android:id="@+id/opt_display"
                              android:layout_width="match_parent"
                              android:layout_height="46dp"
                              android:layout_marginBottom="10dp"
                              android:background="@drawable/panel_item_bg"
                              android:focusable="true"
                              android:gravity="center_vertical"
                              android:paddingStart="18dp"
                              android:paddingEnd="18dp"
                              android:text="Display &amp; Sound"
                              android:textColor="@color/text_primary"
                              android:textSize="15sp"
                              android:textStyle="bold" />


                          <TextView
                              android:id="@+id/opt_apps"
                              android:layout_width="match_parent"
                              android:layout_height="46dp"
                              android:layout_marginBottom="10dp"
                              android:background="@drawable/panel_item_bg"
                              android:focusable="true"
                              android:gravity="center_vertical"
                              android:paddingStart="18dp"
                              android:paddingEnd="18dp"
                              android:text="Manage Installed Apps"
                              android:textColor="@color/text_primary"
                              android:textSize="15sp"
                              android:textStyle="bold" />


                          <TextView
                              android:id="@+id/opt_accounts"
                              android:layout_width="match_parent"
                              android:layout_height="46dp"
                              android:layout_marginBottom="10dp"
                              android:background="@drawable/panel_item_bg"
                              android:focusable="true"
                              android:gravity="center_vertical"
                              android:paddingStart="18dp"
                              android:paddingEnd="18dp"
                              android:text="Accounts &amp; Profiles"
                              android:textColor="@color/text_primary"
                              android:textSize="15sp"
                              android:textStyle="bold" />


                          <TextView
                              android:id="@+id/opt_all_settings"
                              android:layout_width="match_parent"
                              android:layout_height="46dp"
                              android:background="@drawable/panel_item_bg"
                              android:focusable="true"
                              android:gravity="center_vertical"
                              android:paddingStart="18dp"
                              android:paddingEnd="18dp"
                              android:text="All System Settings"
                              android:textColor="@color/text_primary"
                              android:textSize="15sp"
                              android:textStyle="bold" />
                      </LinearLayout>


                      <!-- Wallpaper & Live Waves Group -->
                      <LinearLayout
                          android:id="@+id/group_wallpaper"
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:orientation="vertical"
                          android:visibility="gone">


                          <TextView
                              android:id="@+id/opt_pick_gallery"
                              android:layout_width="match_parent"
                              android:layout_height="48dp"
                              android:layout_marginBottom="10dp"
                              android:background="@drawable/panel_item_bg"
                              android:focusable="true"
                              android:gravity="center_vertical"
                              android:paddingStart="18dp"
                              android:paddingEnd="18dp"
                              android:text="Choose Photo from Gallery / Files"
                              android:textColor="@color/text_primary"
                              android:textSize="15sp"
                              android:textStyle="bold" />


                          <TextView
                              android:id="@+id/opt_toggle_waves"
                              android:layout_width="match_parent"
                              android:layout_height="48dp"
                              android:layout_marginBottom="10dp"
                              android:background="@drawable/panel_item_bg"
                              android:focusable="true"
                              android:gravity="center_vertical"
                              android:paddingStart="18dp"
                              android:paddingEnd="18dp"
                              android:text="PS5 Live Waves: ON"
                              android:textColor="@color/text_primary"
                              android:textSize="15sp"
                              android:textStyle="bold" />


                          <TextView
                              android:id="@+id/opt_reset_wallpaper"
                              android:layout_width="match_parent"
                              android:layout_height="48dp"
                              android:background="@drawable/panel_item_bg"
                              android:focusable="true"
                              android:gravity="center_vertical"
                              android:paddingStart="18dp"
                              android:paddingEnd="18dp"
                              android:text="Reset to Default PS5 Blue"
                              android:textColor="@color/text_primary"
                              android:textSize="15sp"
                              android:textStyle="bold" />
                      </LinearLayout>
                  </LinearLayout>
              </FrameLayout>
          </FrameLayout>
          EOF
          cat << 'EOF' > app/src/main/res/layout/item_app.xml
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="wrap_content"
              android:layout_margin="10dp"
              android:clipChildren="false"
              android:clipToPadding="false"
              android:focusable="true"
              android:focusableInTouchMode="true"
              android:gravity="center"
              android:orientation="vertical">


              <FrameLayout
                  android:id="@+id/card_frame"
                  android:layout_width="match_parent"
                  android:layout_height="100dp"
                  android:background="@drawable/card_bg"
                  android:duplicateParentState="true"
                  android:padding="14dp">


                  <ImageView
                      android:id="@+id/icon"
                      android:layout_width="match_parent"
                      android:layout_height="match_parent"
                      android:layout_gravity="center"
                      android:contentDescription="@null"
                      android:scaleType="fitCenter" />
              </FrameLayout>


              <TextView
                  android:id="@+id/label"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:layout_marginTop="8dp"
                  android:alpha="0.0"
                  android:ellipsize="end"
                  android:gravity="center"
                  android:singleLine="true"
                  android:textColor="@color/text_primary"
                  android:textSize="13sp"
                  android:textStyle="bold" />
          </LinearLayout>
          EOF

          cat << 'EOF' > app/src/main/java/com/me/launcher/PsWaveView.kt
          package com.me.launcher


          import android.content.Context
          import android.graphics.Canvas
          import android.graphics.Color
          import android.graphics.Paint
          import android.graphics.Path
          import android.util.AttributeSet
          import android.view.View
          import kotlin.math.sin


          class PsWaveView @JvmOverloads constructor(
              context: Context,
              attrs: AttributeSet? = null
          ) : View(context, attrs) {


              private val wave1 = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  style = Paint.Style.FILL
                  color = Color.argb(42, 56, 152, 255)
              }
              private val wave2 = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  style = Paint.Style.FILL
                  color = Color.argb(30, 0, 210, 255)
              }
              private val wave3 = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  style = Paint.Style.STROKE
                  strokeWidth = 2.5f
                  color = Color.argb(72, 155, 222, 255)
              }


              private val path = Path()
              private var phase = 0f
              private var running = false


              private val ticker = object : Runnable {
                  override fun run() {
                      if (!running) return
                      phase += 0.025f
                      if (phase > 628.3f) phase = 0f
                      invalidate()
                      postDelayed(this, 33L)
                  }
              }


              fun startWaves() {
                  if (!running && visibility == VISIBLE) {
                      running = true
                      post(ticker)
                  }
              }


              fun stopWaves() {
                  running = false
                  removeCallbacks(ticker)
              }


              override fun onDraw(canvas: Canvas) {
                  super.onDraw(canvas)
                  val w = width.toFloat()
                  val h = height.toFloat()
                  if (w <= 0f || h <= 0f) return


                  drawSilkWave(canvas, w, h, h * 0.52f, h * 0.09f, 1.3f, phase, wave1, true)
                  drawSilkWave(canvas, w, h, h * 0.62f, h * 0.07f, 1.8f, -phase * 0.8f + 1.5f, wave2, true)
                  drawSilkWave(canvas, w, h, h * 0.56f, h * 0.08f, 1.5f, phase * 1.1f + 0.7f, wave3, false)
              }


              private fun drawSilkWave(
                  canvas: Canvas,
                  w: Float,
                  h: Float,
                  baseY: Float,
                  amp: Float,
                  freq: Float,
                  offset: Float,
                  paint: Paint,
                  fillBottom: Boolean
              ) {
                  path.reset()
                  val step = 36f
                  var x = 0f
                  val startY = baseY + sin(offset) * amp
                  path.moveTo(0f, startY)


                  while (x <= w + step) {
                      val norm = (x / w) * Math.PI.toFloat() * 2f * freq
                      val y = baseY + sin(norm + offset) * amp
                      path.lineTo(x, y)
                      x += step
                  }


                  if (fillBottom) {
                      path.lineTo(w, h)
                      path.lineTo(0f, h)
                      path.close()
                  }
                  canvas.drawPath(path, paint)
              }
          }
