              private lateinit var heroSubtitle: TextView
              private lateinit var btnSettings: TextView
              private lateinit var btnWallpaper: TextView
              private lateinit var btnResetHidden: TextView


              private lateinit var controlOverlay: View
              private lateinit var panelTitle: TextView
              private lateinit var groupSettings: View
              private lateinit var groupWallpaper: View
              private lateinit var optToggleWaves: TextView


              private var menuPressCount = 0
              private var lastMenuPressTime = 0L


              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_main)


                  bgWallpaper = findViewById(R.id.bg_wallpaper)
                  bgScrim = findViewById(R.id.bg_scrim)
                  psWaves = findViewById(R.id.ps_waves)
                  networkStatus = findViewById(R.id.network_status)
                  grid = findViewById(R.id.grid)
                  heroShelf = findViewById(R.id.hero_shelf)
                  heroIcon = findViewById(R.id.hero_icon)
                  heroTitle = findViewById(R.id.hero_title)
                  heroSubtitle = findViewById(R.id.hero_subtitle)
                  btnSettings = findViewById(R.id.btn_settings)
                  btnWallpaper = findViewById(R.id.btn_wallpaper)
                  btnResetHidden = findViewById(R.id.btn_reset_hidden)


                  controlOverlay = findViewById(R.id.control_overlay)
                  panelTitle = findViewById(R.id.panel_title)
                  groupSettings = findViewById(R.id.group_settings)
                  groupWallpaper = findViewById(R.id.group_wallpaper)
                  optToggleWaves = findViewById(R.id.opt_toggle_waves)


                  setupPillButton(btnSettings) { openControlPanel(showWallpaper = false) }
                  setupPillButton(btnWallpaper) { openControlPanel(showWallpaper = true) }
                  setupPillButton(btnResetHidden) {
                      prefs().edit().remove("user_hidden").apply()
                      Toast.makeText(this, "Hidden apps restored", Toast.LENGTH_SHORT).show()
                      refreshApps()
                  }


                  setupOverlayOptions()
                  applySavedWallpaperAndWaves()


                  grid.layoutManager = GridLayoutManager(this, Config.COLUMNS)
                  grid.setHasFixedSize(true)
                  grid.clipChildren = false
                  grid.clipToPadding = false


