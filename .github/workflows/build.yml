              private fun prefs() = getSharedPreferences("icetv_prefs", Context.MODE_PRIVATE)


              private fun setupPillButton(btn: TextView, onClick: () -> Unit) {
                  btn.setOnFocusChangeListener { v, hasFocus ->
                      btn.setTextColor(if (hasFocus) Color.BLACK else Color.WHITE)
                      if (hasFocus) v.playSoundEffect(SoundEffectConstants.NAVIGATION_RIGHT)
                      v.animate()
                          .scaleX(if (hasFocus) 1.08f else 1f)
                          .scaleY(if (hasFocus) 1.08f else 1f)
                          .setDuration(120)
                          .start()
                  }
                  btn.setOnClickListener { onClick() }
              }


              private fun setupPanelRow(id: Int, onClick: () -> Unit): TextView {
                  val row = findViewById<TextView>(id)
                  row.setOnFocusChangeListener { v, hasFocus ->
                      row.setTextColor(if (hasFocus) Color.BLACK else Color.WHITE)
                      if (hasFocus) v.playSoundEffect(SoundEffectConstants.NAVIGATION_DOWN)
                      v.animate()
                          .scaleX(if (hasFocus) 1.03f else 1f)
                          .scaleY(if (hasFocus) 1.03f else 1f)
                          .setDuration(100)
                          .start()
                  }
                  row.setOnClickListener { onClick() }
                  return row
              }


              private fun setupOverlayOptions() {
                  setupPanelRow(R.id.opt_wifi) { launchSettingSafe(Settings.ACTION_WIFI_SETTINGS) }
                  setupPanelRow(R.id.opt_bluetooth) { launchSettingSafe(Settings.ACTION_BLUETOOTH_SETTINGS) }
                  setupPanelRow(R.id.opt_display) { launchSettingSafe(Settings.ACTION_DISPLAY_SETTINGS) }
                  setupPanelRow(R.id.opt_apps) { launchSettingSafe(Settings.ACTION_APPLICATION_SETTINGS) }
                  setupPanelRow(R.id.opt_accounts) { launchSettingSafe(Settings.ACTION_SYNC_SETTINGS) }
                  setupPanelRow(R.id.opt_all_settings) { launchSettingSafe(Settings.ACTION_SETTINGS) }


                  setupPanelRow(R.id.opt_pick_gallery) { openGalleryPicker() }
                  setupPanelRow(R.id.opt_toggle_waves) {
                      val next = !prefs().getBoolean("live_waves", true)
                      prefs().edit().putBoolean("live_waves", next).apply()
                      applySavedWallpaperAndWaves()
                  }
                  setupPanelRow(R.id.opt_reset_wallpaper) {
                      val file = File(filesDir, "custom_wallpaper.jpg")
                      if (file.exists()) file.delete()
                      prefs().edit().putBoolean("live_waves", true).apply()
                      applySavedWallpaperAndWaves()
                      Toast.makeText(this, "Reset to default PS5 wallpaper", Toast.LENGTH_SHORT).show()
                  }
              }


              private fun openControlPanel(showWallpaper: Boolean) {
                  controlOverlay.visibility = View.VISIBLE
                  if (showWallpaper) {
                      panelTitle.text = "Wallpaper & Live Effects"
                      groupSettings.visibility = View.GONE
                      groupWallpaper.visibility = View.VISIBLE
                      findViewById<View>(R.id.opt_pick_gallery).requestFocus()
                  } else {
                      panelTitle.text = "IceTV Control Center"
                      groupWallpaper.visibility = View.GONE
                      groupSettings.visibility = View.VISIBLE
                      findViewById<View>(R.id.opt_wifi).requestFocus()
                  }
              }


              private fun closeControlPanel(): Boolean {
                  if (controlOverlay.visibility == View.VISIBLE) {
                      controlOverlay.visibility = View.GONE
                      grid.getChildAt(0)?.requestFocus()
                      return true
                  }
                  return false
              }


              private fun launchSettingSafe(primaryAction: String) {
                  try {
                      startActivity(Intent(primaryAction).addFlags(Intent.FLAG_ACTIVITY_NEW_TASK))
                  } catch (_: Exception) {
                      try {
                          startActivity(Intent(Settings.ACTION_SETTINGS).addFlags(Intent.FLAG_ACTIVITY_NEW_TASK))
                      } catch (_: Exception) {
                          Toast.makeText(this, "Setting unavailable on this device", Toast.LENGTH_SHORT).show()
                      }
                  }
              }


              private fun openGalleryPicker() {
                  val intents = listOf(
                      Intent(Intent.ACTION_OPEN_DOCUMENT).apply {
                          addCategory(Intent.CATEGORY_OPENABLE)
                          type = "image/*"
                      },
                      Intent(Intent.ACTION_GET_CONTENT).apply {
                          addCategory(Intent.CATEGORY_OPENABLE)
                          type = "image/*"
                      },
                      Intent(Intent.ACTION_PICK).apply {
                          type = "image/*"
                      }
                  )
                  for (intent in intents) {
                      try {
                          startActivityForResult(intent, Config.REQ_PICK_WALLPAPER)
                          return
                      } catch (_: Exception) {
                      }
                  }
                  Toast.makeText(this, "No gallery or file picker app found", Toast.LENGTH_SHORT).show()
              }


              @Deprecated("Deprecated in Java")
              override fun onActivityResult(requestCode: Int, resultCode: Int, data: Intent?) {
                  super.onActivityResult(requestCode, resultCode, data)
                  if (requestCode == Config.REQ_PICK_WALLPAPER && resultCode == RESULT_OK) {
                      val uri = data?.data ?: return
                      saveDownsampledWallpaper(uri)
                  }
              }


              private fun saveDownsampledWallpaper(uri: Uri) {
                  Thread {
                      try {
                          val bounds = BitmapFactory.Options().apply { inJustDecodeBounds = true }
                          contentResolver.openInputStream(uri)?.use {
                              BitmapFactory.decodeStream(it, null, bounds)
                          }
                          val targetW = 1280
                          val targetH = 720
                          var sample = 1
                          while (bounds.outWidth / sample > targetW * 2 || bounds.outHeight / sample > targetH * 2) {
                              sample *= 2
                          }
                          val decodeOpts = BitmapFactory.Options().apply {
                              inSampleSize = sample
                              inPreferredConfig = Bitmap.Config.RGB_565
                          }
                          val bmp = contentResolver.openInputStream(uri)?.use {
                              BitmapFactory.decodeStream(it, null, decodeOpts)
                          }
                          if (bmp != null) {
                              val outFile = File(filesDir, "custom_wallpaper.jpg")
                              FileOutputStream(outFile).use { fos ->
                                  bmp.compress(Bitmap.CompressFormat.JPEG, 85, fos)
                              }
                              bmp.recycle()
                              runOnUiThread {
                                  applySavedWallpaperAndWaves()
                                  Toast.makeText(this, "Wallpaper updated", Toast.LENGTH_SHORT).show()
                              }
                          }
                      } catch (_: Exception) {
                          runOnUiThread {
                              Toast.makeText(this, "Could not load selected image", Toast.LENGTH_SHORT).show()
                          }
                      }
                  }.start()
              }


              private fun applySavedWallpaperAndWaves() {
                  val wavesEnabled = prefs().getBoolean("live_waves", true)
                  optToggleWaves.text = if (wavesEnabled) "PS5 Live Waves: ON" else "PS5 Live Waves: OFF"


                  val customFile = File(filesDir, "custom_wallpaper.jpg")
                  if (customFile.exists()) {
                      val opts = BitmapFactory.Options().apply { inPreferredConfig = Bitmap.Config.RGB_565 }
                      val bmp = BitmapFactory.decodeFile(customFile.absolutePath, opts)
                      if (bmp != null) {
                          bgWallpaper.setImageBitmap(bmp)
                          bgWallpaper.visibility = View.VISIBLE
                          bgScrim.visibility = View.VISIBLE
                      }
                  } else {
                      bgWallpaper.setImageDrawable(null)
                      bgWallpaper.visibility = View.GONE
                      bgScrim.visibility = View.GONE
                  }


                  if (wavesEnabled) {
                      psWaves.visibility = View.VISIBLE
                      psWaves.startWaves()
                  } else {
                      psWaves.stopWaves()
                      psWaves.visibility = View.GONE
                  }
              }


              private fun updateNetworkBadge() {
                  try {
                      val cm = getSystemService(Context.CONNECTIVITY_SERVICE) as ConnectivityManager
                      val connected = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                          val caps = cm.getNetworkCapabilities(cm.activeNetwork)
                          caps != null && (caps.hasTransport(NetworkCapabilities.TRANSPORT_WIFI) ||
                                  caps.hasTransport(NetworkCapabilities.TRANSPORT_ETHERNET))
                      } else {
                          @Suppress("DEPRECATION")
                          cm.activeNetworkInfo?.isConnected == true
                      }
                      networkStatus.text = if (connected) "• Online" else "• Offline"
                      networkStatus.setTextColor(if (connected) Color.parseColor("#8CE99A") else Color.parseColor("#FFA8A8"))
                  } catch (_: Exception) {
                      networkStatus.text = ""
                  }
              }


              override fun onResume() {
                  super.onResume()
                  updateNetworkBadge()
                  applySavedWallpaperAndWaves()
              }


              override fun onPause() {
                  psWaves.stopWaves()
                  super.onPause()
              }


              override fun onTrimMemory(level: Int) {
                  super.onTrimMemory(level)
                  if (level >= ComponentCallbacks2.TRIM_MEMORY_UI_HIDDEN) {
                      bgWallpaper.setImageDrawable(null)
                      grid.adapter = null
                  }
              }


              override fun onKeyDown(keyCode: Int, event: KeyEvent?): Boolean {
                  if (keyCode == KeyEvent.KEYCODE_MENU) {
                      val now = SystemClock.elapsedRealtime()
                      if (now - lastMenuPressTime < 1500L) {
                          menuPressCount++
                      } else {
                          menuPressCount = 1
                      }
                      lastMenuPressTime = now


                      if (menuPressCount >= 3) {
                          menuPressCount = 0
                          openStockFireTV()
                          return true
                      }
                  }
                  return super.onKeyDown(keyCode, event)
              }


              private fun openStockFireTV() {
                  val candidates = listOf(
                      "com.amazon.tv.launcher",
                      "com.amazon.firehomestarter"
                  )
                  for (pkg in candidates) {
                      val intent = packageManager.getLaunchIntentForPackage(pkg)
                      if (intent != null) {
                          intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK or Intent.FLAG_ACTIVITY_RESET_TASK_IF_NEEDED)
                          startActivity(intent)
                          return
                      }
                  }
                  Toast.makeText(this, "Original Fire TV launcher not found", Toast.LENGTH_SHORT).show()
              }


              override fun onNewIntent(intent: Intent?) {
                  super.onNewIntent(intent)
                  closeControlPanel()
                  grid.scrollToPosition(0)
                  refreshApps()
              }


              @Deprecated("Deprecated in Java")
              override fun onBackPressed() {
                  closeControlPanel()
              }


              private fun updateTopShelf(app: AppItem) {
                  heroIcon.setImageDrawable(app.icon)
                  heroTitle.text = app.label
                  heroSubtitle.text = "Select to open • Hold Select to hide"
                  heroShelf.alpha = 0.88f
                  heroShelf.animate().alpha(1.0f).setDuration(150).start()
              }


              private fun getUserHidden(): Set<String> {
                  return prefs().getStringSet("user_hidden", emptySet()) ?: emptySet()
              }


              private fun hideApp(pkg: String, label: String) {
                  val updated = getUserHidden().toMutableSet().apply { add(pkg) }
                  prefs().edit().putStringSet("user_hidden", updated).apply()
                  Toast.makeText(this, "Hidden $label", Toast.LENGTH_SHORT).show()
                  refreshApps()
              }


              private fun refreshApps() {
                  val hiddenSet = getUserHidden()
                  btnResetHidden.visibility = if (hiddenSet.isNotEmpty()) View.VISIBLE else View.GONE


                  Thread {
                      val apps = loadApps(hiddenSet)
                      runOnUiThread {
                          if (apps.isNotEmpty()) {
                              updateTopShelf(apps[0])
                          }
                          grid.adapter = AppAdapter(
                              items = apps,
                              onClick = { app ->
                                  try {
                                      startActivity(app.launchIntent)
                                  } catch (_: Exception) {
                                  }
                              },
                              onLongClick = { app -> hideApp(app.pkg, app.label) },
                              onFocus = { app -> updateTopShelf(app) }
                          )
                          grid.post {
                              if (controlOverlay.visibility != View.VISIBLE) {
                                  grid.getChildAt(0)?.requestFocus()
                              }
                          }
                      }
                  }.start()
              }


              private fun loadApps(userHidden: Set<String>): List<AppItem> {
                  val pm = packageManager
                  val out = LinkedHashMap<String, AppItem>()


                  for (cat in listOf(Intent.CATEGORY_LEANBACK_LAUNCHER, Intent.CATEGORY_LAUNCHER)) {
                      val query = Intent(Intent.ACTION_MAIN).addCategory(cat)
                      for (ri in pm.queryIntentActivities(query, 0)) {
                          val pkg = ri.activityInfo.packageName
                          if (pkg in Config.SYSTEM_HIDDEN || pkg in userHidden || out.containsKey(pkg)) continue


                          val launch = Intent(Intent.ACTION_MAIN)
                              .addCategory(cat)
                              .setClassName(pkg, ri.activityInfo.name)
                              .addFlags(Intent.FLAG_ACTIVITY_NEW_TASK or Intent.FLAG_ACTIVITY_RESET_TASK_IF_NEEDED)


                          val drawable = ri.activityInfo.loadBanner(pm) ?: ri.loadIcon(pm)
                          out[pkg] = AppItem(
                              label = ri.loadLabel(pm).toString(),
                              pkg = pkg,
                              icon = drawable,
                              launchIntent = launch
                          )
                      }
                  }


                  return out.values.sortedWith(
                      compareBy(
                          { val idx = Config.PINNED.indexOf(it.pkg); if (idx == -1) Int.MAX_VALUE else idx },
                          { it.label.lowercase() }
                      )
                  )
              }
          }


          class AppAdapter(
              private val items: List<AppItem>,
              private val onClick: (AppItem) -> Unit,
              private val onLongClick: (AppItem) -> Unit,
              private val onFocus: (AppItem) -> Unit
          ) : RecyclerView.Adapter<AppAdapter.VH>() {


              private val spring = OvershootInterpolator(1.4f)


              class VH(v: View) : RecyclerView.ViewHolder(v) {
                  val icon: ImageView = v.findViewById(R.id.icon)
                  val label: TextView = v.findViewById(R.id.label)
              }


              override fun onCreateViewHolder(parent: ViewGroup, viewType: Int): VH {
                  val view = LayoutInflater.from(parent.context)
                      .inflate(R.layout.item_app, parent, false)
                  return VH(view)
              }


              override fun getItemCount() = items.size


              override fun onBindViewHolder(h: VH, position: Int) {
                  val app = items[position]
                  h.icon.setImageDrawable(app.icon)
                  h.label.text = app.label
                  h.itemView.setOnClickListener { onClick(app) }
                  h.itemView.setOnLongClickListener {
                      onLongClick(app)
                      true
                  }
                  h.itemView.setOnFocusChangeListener { v, hasFocus ->
                      val scale = if (hasFocus) Config.FOCUS_SCALE else 1.0f
                      v.translationZ = if (hasFocus) 14f else 0f
                      if (hasFocus) {
                          v.playSoundEffect(SoundEffectConstants.NAVIGATION_RIGHT)
                      }
                      v.animate()
                          .scaleX(scale)
                          .scaleY(scale)
                          .setInterpolator(if (hasFocus) spring else null)
                          .setDuration(160)
                          .start()
                      h.label.animate()
                          .alpha(if (hasFocus) 1.0f else 0.0f)
                          .setDuration(130)
                          .start()
                      if (hasFocus) {
                          onFocus(app)
                      }
                  }
              }
          }
